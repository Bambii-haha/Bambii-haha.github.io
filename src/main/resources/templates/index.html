<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DaHa</title>
    <style>
        :root {
            --bg: #f5f5fb;
            --card: #fff;
            --line: #e8e8ef;
            --text: #202124;
            --muted: #73777d;
            --brand: #2aa198;
            --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--text);
            background: var(--bg);
            font-family: Arial, "Microsoft YaHei", sans-serif;
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .layout {
            width: min(1500px, calc(100% - 80px));
            margin: 0 auto;
            padding: 36px 0;
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr) 300px;
            gap: 40px;
            align-items: start;
        }

        .sidebar {
            position: sticky;
            top: 36px;
        }

        .profile {
            margin-bottom: 34px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            border-radius: 50%;
            background: #d0d0d0;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .site-title {
            margin: 0 0 6px;
            color: #34495e;
            font-size: 18px;
            line-height: 1.25;
        }

        .site-desc {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .nav {
            display: grid;
            gap: 12px;
        }

        .nav a {
            padding: 8px 0;
            color: var(--muted);
            font-size: 15px;
        }

        .nav a.active {
            color: #34495e;
            font-weight: 700;
        }

        .posts {
            display: grid;
            gap: 34px;
        }

        .post-card,
        .search,
        .archive-list {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .post-cover {
            height: 210px;
            background: #eef0f4;
            overflow: hidden;
        }

        .post-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .post-body {
            padding: 28px;
        }

        .tag {
            display: inline-block;
            margin-bottom: 16px;
            padding: 6px 14px;
            border-radius: 4px;
            color: #fff;
            background: var(--brand);
            font-weight: 600;
            font-size: 14px;
        }

        .post-title {
            margin: 0 0 10px;
            color: #34495e;
            font-size: 24px;
            line-height: 1.35;
        }

        .post-desc {
            margin: 0 0 14px;
            color: var(--muted);
            font-size: 18px;
        }

        .post-meta {
            color: var(--muted);
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 14px;
        }

        .search {
            padding: 16px 22px;
        }

        .search label,
        .widget-title {
            display: block;
            color: var(--muted);
            font-weight: 700;
            text-transform: uppercase;
        }

        .search input {
            width: 100%;
            margin-top: 6px;
            border: 0;
            outline: 0;
            color: var(--text);
            background: transparent;
            font: inherit;
        }

        .widget {
            margin-top: 46px;
        }

        .widget-title {
            margin: 0 0 14px;
            font-size: 18px;
        }

        .archive-row {
            min-height: 48px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--line);
        }

        .archive-row:last-child {
            border-bottom: 0;
        }

        .cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cloud a {
            padding: 7px 16px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--card);
            box-shadow: var(--shadow);
            font-size: 14px;
        }

        @media (max-width: 1180px) {
            .layout {
                grid-template-columns: 200px minmax(0, 1fr);
            }

            .right {
                display: none;
            }
        }

        @media (max-width: 760px) {
            .layout {
                width: min(680px, calc(100% - 28px));
                padding: 28px 0;
                display: block;
            }

            .sidebar {
                position: static;
            }

            .profile {
                display: grid;
                grid-template-columns: 88px 1fr;
                gap: 18px;
                align-items: center;
                margin-bottom: 20px;
            }

            .avatar {
                width: 88px;
                height: 88px;
                margin: 0;
            }

            .nav {
                display: flex;
                gap: 16px;
                margin-bottom: 28px;
                overflow-x: auto;
            }

            .posts {
                gap: 28px;
            }

            .post-cover {
                height: 190px;
            }

            .post-body {
                padding: 24px;
            }

            .post-title {
                font-size: 22px;
            }

            .post-desc {
                font-size: 16px;
            }
        }
    </style>
</head>
